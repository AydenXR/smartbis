name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y ejecutar despliegue en Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # Detener el despliegue en el primer error, para no dejar el servidor a medias
            set -e
            cd /var/www/smartbis
            # Sin hooks: el hook de Git LFS falla porque git-lfs no está instalado en el
            # servidor, y LFS solo guarda los instaladores .exe, que aquí no se usan
            git -c core.hooksPath=/dev/null fetch origin main
            git -c core.hooksPath=/dev/null checkout main
            git -c core.hooksPath=/dev/null reset --hard origin/main

            # Las imágenes instalan dependencias y compilan el frontend dentro de Docker
            # (Dockerfile.web, etapa builder), así que no se usa node_modules del servidor.
            # Se construye primero: si falla, los contenedores actuales siguen funcionando.
            docker compose build --no-cache

            # Reemplaza los contenedores por los nuevos (solo hay corte durante el reinicio)
            docker compose up -d --remove-orphans
            docker compose ps