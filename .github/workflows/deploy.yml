name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y ejecutar despliegue en Contabo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd /var/www/smartbis
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            
            # 1. Instalar dependencias y compilar el frontend para generar la carpeta 'dist' nueva
            npm ci
            npm run build
            
            # 2. Reconstruir los contenedores tomando la carpeta 'dist' recién creada
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker compose ps