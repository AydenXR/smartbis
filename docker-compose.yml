services:
  smartbis-api:
    container_name: smartbis-api
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - TZ=America/Hermosillo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./clientsdata:/app/clientsdata:rw
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  smartbis-web:
    container_name: smartbis-web
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    network_mode: host
    depends_on:
      - smartbis-api
    restart: unless-stopped
    environment:
      - TZ=America/Hermosillo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
